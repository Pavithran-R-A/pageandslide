<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F5F0E6" />
    <title>Page not found | Page &amp; Slide</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; background: #f5f0e6; color: #151412; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f0e6; }
      main { width: min(720px, 100%); border: 1px solid #d9cfbf; background: #fbf8f1; padding: clamp(32px, 7vw, 72px); }
      img { width: 56px; height: 56px; margin-bottom: 32px; }
      p { margin: 0 0 12px; color: #7b2940; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 0 0 20px; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(44px, 9vw, 82px); font-weight: 500; line-height: .95; }
      .copy { max-width: 520px; margin-bottom: 32px; color: #514a42; font-size: 17px; line-height: 1.7; text-transform: none; letter-spacing: 0; font-weight: 400; }
      a { display: inline-block; padding: 14px 20px; background: #7b2940; color: white; text-decoration: none; font-weight: 700; }
      a:focus-visible { outline: 3px solid #151412; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-mark.svg" alt="Page &amp; Slide" />
      <p>404</p>
      <h1>Page not found.</h1>
      <p class="copy">The page you tried to open does not exist. Return to Page &amp; Slide to browse presentations, reports, notes and resumes.</p>
      <a href="/">Back to Page &amp; Slide</a>
    </main>
  </body>
</html>
